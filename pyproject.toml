[project]
name = "audioshape"
version = "0.1.0"
description = "Datasheet-based sealed-box bass driver ranking for a small-area DSP stereo system"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]
release = ["bibtexparser"]

[project.scripts]
audioshape = "audioshape.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audioshape"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
